{% extends "base.html" %}

{% block content %}
<section class="page-shell characters-layout">
    <aside class="char-nav panel">
        <h2>Character library</h2>
        <p class="muted">Central refs for Gary, Linda, Chris, Chloe.</p>
        <div class="char-list">
            {% for c in characters %}
            <a class="char-list-item {% if c.id == active.id %}active{% endif %}" href="/characters?char_id={{ c.id }}">
                <img src="{{ c.image_url }}" alt="{{ c.name }}">
                <span>{{ c.name }}</span>
            </a>
            {% endfor %}
        </div>
    </aside>

    <div class="panel char-editor">
        <div class="char-editor-head">
            <div class="char-preview-frame">
                <img class="char-preview" src="{{ active.image_url }}" alt="{{ active.name }}">
            </div>
            <div class="char-editor-meta">
                <h1>{{ active.name }}</h1>
                <p class="muted">{{ active.role }}</p>
                {% if active.audio_url %}
                <audio class="char-audio-player" controls preload="metadata" src="{{ active.audio_url }}"></audio>
                {% endif %}
            </div>
        </div>

        <div class="char-media-row">
            <form method="post" action="/ui/characters/{{ active.id }}/image" enctype="multipart/form-data" class="char-media-box">
                <input type="file" name="image" accept="image/png,image/jpeg,image/webp" required>
                <button class="btn btn-sm btn-primary" type="submit">Replace image</button>
            </form>
            <form method="post" action="/ui/characters/{{ active.id }}/audio" enctype="multipart/form-data" class="char-media-box">
                <input type="file" name="audio" accept="audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/ogg,audio/webm,audio/mp4,audio/x-m4a,.mp3,.wav,.ogg,.m4a,.webm" required>
                <button class="btn btn-sm btn-primary" type="submit">Upload audio</button>
            </form>
        </div>

        <form method="post" action="/ui/characters/{{ active.id }}/save" class="form-grid">
            <label>Name <input class="input" name="name" value="{{ active.name }}"></label>
            <label>Role <input class="input" name="role" value="{{ active.role }}"></label>
            <label>Archetype <input class="input" name="archetype" value="{{ active.archetype }}"></label>
            <label class="full">Description
                <textarea class="input" name="description" rows="4">{{ active.description }}</textarea>
            </label>
            <label class="full">Personality / instructions
                <textarea class="input" name="personality" rows="3">{{ active.personality }}</textarea>
            </label>
            <label class="full">Visual prompt
                <textarea class="input" name="visual_prompt" rows="4">{{ active.visual_prompt }}</textarea>
            </label>
            <label>Tone <input class="input" name="voice_tone" value="{{ active.voice.tone }}"></label>
            <label>Speed hint
                <input
                    class="input input-speed"
                    type="number"
                    name="voice_speed"
                    value="{{ active.voice.speed or '1.00' }}"
                    min="0"
                    max="2"
                    step="0.25"
                    inputmode="decimal"
                    placeholder="1.00"
                >
            </label>
            <label>Pitch hint
                <select class="input" name="voice_pitch">
                    {% set pitch = (active.voice.pitch or 'medium')|lower %}
                    <option value="low" {% if pitch == 'low' %}selected{% endif %}>Low</option>
                    <option value="medium" {% if pitch == 'medium' %}selected{% endif %}>Medium</option>
                    <option value="high" {% if pitch == 'high' %}selected{% endif %}>High</option>
                </select>
            </label>
            <label class="full">Audio tag
                <input class="input" name="voice_delivery" value="{{ active.voice.delivery }}" placeholder="[Gary, stressed suburban dad]:">
            </label>
            <div class="full">
                <button class="btn btn-primary" type="submit">Save character</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
