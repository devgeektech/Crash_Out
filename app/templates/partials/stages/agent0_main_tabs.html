{# Full-width horizontal tabs: Trend Research | Approve pitch #}
{% set active_tab = agent0_tab or 'research' %}
{% if research_view == 'history' and active_tab == 'research' %}
  {% set active_tab = 'history' %}
{% endif %}
<nav class="agent0-main-tabs" role="tablist" aria-label="Agent 0 workflow tabs">
    <a
        class="agent0-main-tab {% if active_tab == 'research' %}is-active{% endif %}"
        href="/studio?stage=0&research=today"
        hx-get="/ui/stage/0?research=today"
        hx-target="#workspace"
        hx-swap="outerHTML"
        hx-push-url="/studio?stage=0&research=today"
        hx-indicator="#busy"
        role="tab"
        aria-selected="{{ 'true' if active_tab == 'research' else 'false' }}"
    >Trend Research</a>
    <a
        class="agent0-main-tab {% if active_tab == 'approve' %}is-active{% endif %}"
        href="/studio?stage=1"
        hx-get="/ui/stage/1"
        hx-target="#workspace"
        hx-swap="outerHTML"
        hx-push-url="/studio?stage=1"
        hx-indicator="#busy"
        role="tab"
        aria-selected="{{ 'true' if active_tab == 'approve' else 'false' }}"
    >Approve pitch</a>
</nav>
