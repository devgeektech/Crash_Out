<section class="panel completed-panel">
    <h2>Episode complete</h2>
    <p>All gateways are done. Review the master cut or start the next episode.</p>
    <div class="completed-actions">
        <button
            class="btn btn-ghost"
            type="button"
            hx-get="/ui/stage/3"
            hx-target="#workspace"
            hx-swap="outerHTML"
            hx-indicator="#busy"
        >View video</button>
        <button
            class="btn btn-primary"
            type="button"
            hx-post="/ui/episode/reset"
            hx-target="#workspace"
            hx-swap="outerHTML"
            hx-indicator="#busy"
        >Produce next episode</button>
    </div>
</section>
