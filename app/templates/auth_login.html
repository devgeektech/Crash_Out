{% extends "auth_base.html" %}
{% block title %}Sign in — Crash Out{% endblock %}

{% block content %}
<section class="auth-card">
    <header class="auth-card-head">
        <h1>Sign in</h1>
        <p class="muted">Use your Crash Out studio account.</p>
    </header>

    {% if error %}
    <div class="auth-alert" role="alert">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="post" action="/login" autocomplete="on">
        <input type="hidden" name="next" value="{{ next|default('/') }}">
        <label class="field">
            <span class="field-label">Email</span>
            <input class="input" type="email" name="email" value="{{ email|default('') }}" required autofocus autocomplete="username">
        </label>
        <label class="field">
            <span class="field-label">Password</span>
            <input class="input" type="password" name="password" required autocomplete="current-password">
        </label>
        <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
    </form>
</section>
{% endblock %}
