{% extends "auth_base.html" %}
{% block title %}Sign in — Crash Out{% endblock %}

{% block content %}
<section class="auth-card">
    <div class="auth-card-brand">
        <a class="brand auth-brand" href="/login" aria-label="Crash Out Production Studio">
            <div class="brand-mark">
                <img src="/static/assets/brand/crash_out_badge.jpg" alt="Crash Out Logo">
            </div>
        </a>
    </div>

    <header class="auth-card-head">
        <h1>Sign in</h1>
        <p class="muted">Sign in to open the Crash Out Production Studio</p>
    </header>

    {% if error %}
    <div class="auth-alert" role="alert">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form class="auth-form" method="post" action="/login" autocomplete="on">
        <input type="hidden" name="next" value="{{ next|default('/') }}">
        <label class="field">
            <span class="field-label">Email</span>
            <input class="input" type="email" name="email" value="{{ email|default('') }}" required autofocus autocomplete="username">
        </label>
        <label class="field">
            <span class="field-label">Password</span>
            <div class="password-input-wrap" style="position: relative; display: flex; align-items: center; width: 100%;">
                <input id="login-password" class="input" type="password" name="password" required autocomplete="current-password" style="padding-right: 2.5rem; width: 100%;">
                <button
                    type="button"
                    id="toggle-password-btn"
                    aria-label="Toggle password visibility"
                    onclick="togglePasswordVisibility()"
                    style="position: absolute; right: 0.6rem; background: transparent; border: none; cursor: pointer; padding: 0.25rem; display: flex; align-items: center; justify-content: center; color: var(--muted);"
                >
                    <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg id="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                        <line x1="2" y1="2" x2="22" y2="22"></line>
                    </svg>
                </button>
            </div>
        </label>
        <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
    </form>
</section>

<script>
function togglePasswordVisibility() {
    var pass = document.getElementById('login-password');
    var eye = document.getElementById('eye-icon');
    var eyeOff = document.getElementById('eye-off-icon');
    if (!pass) return;
    if (pass.type === 'password') {
        pass.type = 'text';
        if (eye) eye.style.display = 'none';
        if (eyeOff) eyeOff.style.display = 'block';
    } else {
        pass.type = 'password';
        if (eye) eye.style.display = 'block';
        if (eyeOff) eyeOff.style.display = 'none';
    }
}
</script>
{% endblock %}
