<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Crash Out{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v={{ static_cache_bust() }}">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v={{ static_cache_bust() }}">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon.png?v={{ static_cache_bust() }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v={{ static_cache_bust() }}">
    <link rel="stylesheet" href="/static/css/app.css?v={{ static_cache_bust() }}">
</head>
<body class="auth-body" data-page="{{ page|default('login') }}">
    <div class="auth-shell">
        <div class="auth-backdrop" aria-hidden="true">
            <img
                class="auth-backdrop-img"
                src="/static/assets/brand/crash_out_family.png"
                alt=""
            >
            <div class="auth-backdrop-shade"></div>
        </div>

        <main class="auth-main">
            <div class="auth-center">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
